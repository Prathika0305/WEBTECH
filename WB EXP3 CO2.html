<!DOCTYPE html>
<html>
<head>
<title>Calculator</title>
<style>
body{display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial;}
.calc{display:grid;grid-template-columns:repeat(4,70px);gap:10px;}
input{grid-column:span 4;height:50px;font-size:20px;text-align:right;}
button{height:50px;font-size:18px;}
</style>
</head>
<body>
<div class="calc">
<input type="text" id="d" readonly>
<button onclick="d.value+='1'">1</button>
<button onclick="d.value+='2'">2</button>
<button onclick="d.value+='3'">3</button>
<button onclick="d.value+='+'">+</button>
<button onclick="d.value+='4'">4</button>
<button onclick="d.value+='5'">5</button>
<button onclick="d.value+='6'">6</button>
<button onclick="d.value+='-'">-</button>
<button onclick="d.value+='7'">7</button>
<button onclick="d.value+='8'">8</button>
<button onclick="d.value+='9'">9</button>
<button onclick="d.value+='*'">*</button>
<button onclick="d.value='Math.sqrt('+d.value+')'">√</button>
<button onclick="d.value+='0'">0</button>
<button onclick="d.value=eval(d.value)">=</button>
<button onclick="d.value+='/'">/</button>
<button onclick="d.value=''" style="grid-column:span 4">Clear</button>
</div>
<script>
const d=document.getElementById('d');
</script>
</body>
</html>
