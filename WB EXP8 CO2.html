<!DOCTYPE html>
<html>
<head>
<title>Clock and Countdown</title>
<style>
body{text-align:center;font-family:Arial;background:#222;color:white;padding-top:50px;}
#clock{font-size:40px;margin-bottom:30px;}
#count{font-size:30px;color:#00ff99;}
</style>
</head>
<body>
<h1>Digital Clock</h1>
<div id="clock"></div>

<h1>Exam Countdown (1 Minute)</h1>
<div id="count"></div>

<script>
function updateClock(){
  let now=new Date();
  document.getElementById('clock').innerHTML=now.toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

let sec=60;
let timer=setInterval(function(){
  let m=Math.floor(sec/60);
  let s=sec%60;
  document.getElementById('count').innerHTML=m+':'+(s<10?'0':'')+s;
  sec--;
  if(sec<0){
    clearInterval(timer);
    document.getElementById('count').innerHTML='Time Up!';
  }
},1000);
</script>
</body>
</html>
