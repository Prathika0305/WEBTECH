<!DOCTYPE html>
<html>
<head>
<title>Shopping Cart</title>
<style>
body{font-family:Arial;padding:20px;}
table{border-collapse:collapse;width:400px;}
td,th{border:1px solid black;padding:8px;text-align:center;}
button{margin-top:10px;padding:8px 15px;}
</style>
</head>
<body>
<h2>Shopping Cart</h2>

<table>
<tr><th>Product</th><th>Price</th><th>Qty</th></tr>
<tr>
<td>Notebook</td>
<td>50</td>
<td><input type="number" id="q1" value="1" min="0"></td>
</tr>
<tr>
<td>Pen</td>
<td>10</td>
<td><input type="number" id="q2" value="1" min="0"></td>
</tr>
</table>

<button onclick="bill()">Generate Bill</button>

<h3 id="out"></h3>

<script>
function bill(){
  let total=50*Number(q1.value)+10*Number(q2.value);
  let discount=total>100 ? total*0.10 : 0;
  let tax=(total-discount)*0.05;
  let final=(total-discount)+tax;

  document.getElementById('out').innerHTML=
  'Total: ₹'+total+'<br>Discount: ₹'+discount.toFixed(2)+
  '<br>Tax: ₹'+tax.toFixed(2)+
  '<br><b>Final Amount: ₹'+final.toFixed(2)+'</b>';
}
</script>
</body>
</html>
