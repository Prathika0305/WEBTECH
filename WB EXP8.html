<!DOCTYPE html>
<html>
<head>
    <title>Images Hyperlinks and Iframe</title>
</head>
<body>

    <h1>Webpage with Image, Link and Iframe</h1>

    <h2>Image</h2>
    <img src="https://via.placeholder.com/300x150"
         alt="College Image"
         width="300"
         height="150" />

    <h2>Hyperlink</h2>
    <a href="https://www.wikipedia.org" target="_blank">
        Open Wikipedia
    </a>

    <h2>Iframe</h2>
    <iframe src="https://example.com"
            width="500"
            height="300"
            title="Example Website">
    </iframe>

</body>
</html>
