<!DOCTYPE html>
<html>
<head>

<title>GET Method</title>

<style>

body{

font-family:Arial;

background:#E3F2FD;

}

.container{

width:400px;

margin:80px auto;

background:white;

padding:25px;

border-radius:10px;

box-shadow:0 0 15px gray;

}

h2{

text-align:center;

color:#1565C0;

}

input{

width:100%;

padding:10px;

margin:10px 0;

}

button{

background:#1565C0;

color:white;

padding:10px;

border:none;

width:100%;

cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<h2>GET Method Form</h2>

<form action="#" method="get">

<input type="text" name="username" placeholder="Enter Name">

<input type="email" name="email" placeholder="Enter Email">

<button type="submit">

Submit

</button>

</form>

</div>

</body>

</html>
