<!DOCTYPE html>
<html>
<head>
<title>Debug Demo</title>
<style>
.box{
  width:250px;
  padding:20px;
  background:#e6f2ff;
  border:2px solid #0077cc;
  margin:20px auto;
  text-align:center;
}
button{
  padding:10px 20px;
}
</style>
</head>
<body>

<div class="box">
  <h2>Debug Example</h2>
  <button onclick="test()">Run</button>
  <p id="msg"></p>
</div>

<script>
function test(){
  try{
    console.log('Button clicked');
    let a=10;
    let b=2;
    debugger;
    let c=a/b;
    document.getElementById('msg').innerHTML='Result: '+c;
  }
  catch(e){
    document.getElementById('msg').innerHTML='Error: '+e.message;
  }
}
</script>

</body>
</html>
