<!DOCTYPE html>
<html>
<head>
<title>Student Profile</title>
<style>
body{
  font-family:Arial;
  background:#f2f2f2;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.card{
  background:white;
  width:350px;
  padding:20px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 0 10px gray;
}
img{
  width:120px;
  border-radius:50%;
  border:3px solid #0077cc;
}
h2{color:#0077cc;}
@media(max-width:400px){
  .card{width:90%;}
}
</style>
</head>
<body>
<div class="card">
  <img src="https://via.placeholder.com/120" alt="Student">
  <h2>K Prathika</h2>
  <p>B.Tech Information Technology</p>
  <p>Saveetha University</p>
</div>
</body>
</html>
