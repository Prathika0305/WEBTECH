<!DOCTYPE html>

<html>

<head>

<title>Class Timetable</title>

<style>

body{

font-family:Arial;

background:#F2F6FC;

}

.container{

width:90%;

margin:30px auto;

background:white;

padding:20px;

box-shadow:0px 0px 15px gray;

border-radius:10px;

}

h1{

text-align:center;

color:#003366;

}

table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}

caption{

font-size:28px;

font-weight:bold;

padding:15px;

color:#00509E;

}

th{

background:#00509E;

color:white;

padding:15px;

}

td{

text-align:center;

padding:15px;

}

tr:nth-child(even){

background:#E8F0FE;

}

tr:hover{

background:#D1E7FF;

}

table,th,td{

border:2px solid gray;

}

</style>

</head>

<body>

<div class="container">

<h1>ABC Engineering College</h1>

<table cellpadding="10" cellspacing="5">

<caption>Class Timetable</caption>

<tr>

<th>Day</th>

<th>9-10</th>

<th>10-11</th>

<th>11-12</th>

<th>1-2</th>

<th>2-3</th>

</tr>

<tr>

<td>Monday</td>

<td>HTML</td>

<td colspan="2">Java Lab</td>

<td>Lunch</td>

<td>Python</td>

</tr>

<tr>

<td>Tuesday</td>

<td rowspan="2">Maths</td>

<td>Java</td>

<td>Python</td>

<td>Lunch</td>

<td>WT</td>

</tr>

<tr>

<td>Wednesday</td>

<td>HTML</td>

<td>CN</td>

<td>Lunch</td>

<td>OS</td>

</tr>

<tr>

<td>Thursday</td>

<td>Java</td>

<td>Python</td>

<td>WT</td>

<td>Lunch</td>

<td>Project</td>

</tr>

<tr>

<td>Friday</td>

<td>HTML</td>

<td>OS</td>

<td>CN</td>

<td>Lunch</td>

<td>Seminar</td>

</tr>

</table>

</div>

</body>

</html>
